[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "divina-midi"
version = "0.1.0"
description = "Turn the cantos of Dante's Divina Commedia into MIDI music, from word embeddings to sentiment analysis."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.9",
    "gensim>=4.3",
    "mido>=1.3",
    "numpy",
    "pandas>=1.2",
    "requests>=2.25",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
divina-midi = "divina_midi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: needs the downloaded corpus in data/ (run `divina-midi download` first)"]
